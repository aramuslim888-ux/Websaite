<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مام سۆڵ 🦂 | mam soul</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #060709;
            color: #ffd700;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* باکگراوندی کاندڵی سەوز و سوری جووڵاو */
        .candlestick-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            opacity: 0.15;
            pointer-events: none;
        }

        .candle {
            width: 14px;
            border-radius: 3px;
            position: relative;
            animation: floatCandle 4s infinite ease-in-out alternate;
        }

        .candle::before, .candle::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
        }

        .candle.green {
            background-color: #00ff66;
            box-shadow: 0 0 10px #00ff66;
        }

        .candle.green::before { top: -12px; height: 12px; background-color: #00ff66; }
        .candle.green::after { bottom: -12px; height: 12px; background-color: #00ff66; }

        .candle.red {
            background-color: #ff334b;
            box-shadow: 0 0 10px #ff334b;
        }

        .candle.red::before { top: -12px; height: 12px; background-color: #ff334b; }
        .candle.red::after { bottom: -12px; height: 12px; background-color: #ff334b; }

        @keyframes floatCandle {
            0% { transform: translateY(0px); scaleY(1); }
            50% { transform: translateY(-15px); scaleY(1.1); }
            100% { transform: translateY(10px); scaleY(0.95); }
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
            margin-bottom: 12px;
            aspect-ratio: 1 / 1;
        }

        h1 {
            font-size: 28px;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
